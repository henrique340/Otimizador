name: ci-cd-lambda

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  ci:
    name: Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check src tests

      - name: Pytest
        run: python -m pytest -q

  deploy-dev:
    name: Deploy Lambda (dev)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Lambda package
        run: |
          python -m pip install --upgrade pip
          rm -rf dist/lambda_package
          mkdir -p dist/lambda_package
          pip install -r requirements.txt -t dist/lambda_package
          cp -r src/otimizador dist/lambda_package/
          cd dist/lambda_package
          zip -r ../otimizador-lambda.zip .

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://dist/otimizador-lambda.zip \
            --region "${{ vars.AWS_REGION }}"

      - name: Smoke invoke Lambda
        run: |
          aws lambda invoke \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            --region "${{ vars.AWS_REGION }}" \
            smoke-response.json
          cat smoke-response.json
