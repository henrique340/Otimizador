name: ci-cd-lambda

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  ci:
    name: Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check src tests

      - name: Pytest
        run: python -m pytest -q

  deploy-dev:
    name: Deploy Lambdas (dev)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        lambda_name:
          - quantvision-data-handler
          - quantvision-optimize-handler
          - quantvision-report-handler
          - quantvision-status-handler

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Lambda package
        run: |
          set -euo pipefail
          rm -rf dist/lambda_package
          mkdir -p dist/lambda_package

          # Build dependencies inside the official Lambda Python 3.11 image
          # to avoid GLIBC/ABI incompatibilities (numpy/pandas).
          docker run --rm \
            -v "$PWD":/var/task \
            -w /var/task \
            --entrypoint /bin/bash \
            public.ecr.aws/lambda/python:3.11 \
            -lc "pip install --no-cache-dir -r requirements.txt -t dist/lambda_package"

          cp -r src/otimizador dist/lambda_package/
          echo "Package folder size:"
          du -sh dist/lambda_package
          cd dist/lambda_package
          zip -r ../otimizador-lambda.zip .
          echo "Zip size:"
          du -h ../otimizador-lambda.zip

      - name: Upload package to S3
        run: |
          set -euo pipefail
          PACKAGE_KEY="lambda/${{ github.repository }}/${{ github.sha }}/${{ matrix.lambda_name }}/otimizador-lambda.zip"
          echo "PACKAGE_KEY=$PACKAGE_KEY" >> "$GITHUB_ENV"
          aws s3 cp dist/otimizador-lambda.zip \
            "s3://${{ vars.LAMBDA_DEPLOY_BUCKET }}/$PACKAGE_KEY" \
            --region "${{ vars.AWS_REGION }}"

      - name: Deploy Lambda code (from S3)
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "${{ matrix.lambda_name }}" \
            --s3-bucket "${{ vars.LAMBDA_DEPLOY_BUCKET }}" \
            --s3-key "${PACKAGE_KEY}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Smoke invoke Lambda
        run: |
          aws lambda invoke \
            --function-name "${{ matrix.lambda_name }}" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            --region "${{ vars.AWS_REGION }}" \
            "smoke-${{ matrix.lambda_name }}.json"
          cat "smoke-${{ matrix.lambda_name }}.json"
