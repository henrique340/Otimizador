[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otimizador"
version = "0.1.0"
description = "MVP para comparação de algoritmos de otimização em séries temporais financeiras"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Otimizador Team" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "yfinance>=0.2.44",
  "scipy>=1.11"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-mock>=3.14",
  "ruff>=0.6"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]